# Historical configuration values preserved for provenance.
# The archived loader explicitly requests torch.float32 despite precision: bf16.
# Saved ZO adapters are F32; frozen-base runtime dtype was not directly logged.
# Final selected ZO runs use C1 (rank 4, q_proj, alpha 16), labels 0, 1, 42.
# The historical seeds list below is 0, 1, 2; do not silently relabel past runs.
# This annotation does not change executable settings or establish a rerun.
# Phase 2 Configuration

model:
  name: "Qwen/Qwen2.5-1.5B"
  revision: "main"
  precision: "bf16"
  max_seq_length: 256

task:
  name: "sst2"
  dataset: "glue"
  subset: "sst2"
  text_field: "sentence"
  label_field: "label"

training:
  batch_size: 16
  max_steps: 2000
  target_loss: 0.50
  eval_every: 100
  log_every: 1
  grad_clip: 1.0
  target_consecutive_steps: 3

methods:
  fo:
    optimizer: "adamw"
    lr: 1.0e-4
    weight_decay: 0.01
    warmup_steps: 50
  zo:
    lr: 1.0e-5
    eps: 1.0e-3
    momentum: 0.0
    normalize_z: false
    grad_clip: 1000.0

seeds: [0, 1, 2]

configs:
  C1:
    lora_rank: 4
    target_modules: ["q_proj"]
  C2:
    lora_rank: 8
    target_modules: ["q_proj"]
  C3:
    lora_rank: 4
    target_modules: ["q_proj", "k_proj", "v_proj"]
  C4:
    lora_rank: 8
    target_modules: ["q_proj", "k_proj", "v_proj"]

lora:
  alpha: 16
  dropout: 0.0
  bias: "none"

paths:
  results_dir: "results/phase2"
  pilot_dir: "results/pilot"